version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    volumes:
      - ../..:/workspaces:cached

    command: sleep infinity

  db:
    image: postgres:latest
    restart: unless-stopped

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql

    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres

volumes:
  postgres-data: